<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synguard Customer Intelligence Demo</title>
<style>
/* Layout: mock Synguard site (scrolls) + Syntasa presenter widgets, either
   docked in a right-hand rail or floating as draggable cards over the site.
   Cue bar runs along the bottom. */
:root{
  /* mock site */
  --bd-blue:#4f46e5; --bd-blue-dk:#3730a3; --bd-blue-soft:#eef0ff; --bd-night:#05080f; --bd-night-2:#0c1322;
  --ink:#0b1220; --muted:#5a6578; --line:#e3e8f0; --paper:#ffffff; --tint:#f4f7fb;
  --danger:#d92d20; --danger-soft:#fdecea; --safe:#18c37e;
  /* Syntasa presenter UI */
  --sy-green:#13895c; --sy-green-2:#1fb87a; --sy-mint:#d3f3e4; --sy-lav:#eee8fd; --sy-aqua:#cdf3ee;
  --sy-navy:#0f1a24; --sy-ink:#13222e; --sy-muted:#5f707b; --sy-line:#dce8e3; --sy-card:rgba(255,255,255,.94);
  --sy-warn:#b06a00; --sy-violet:#6c55e0;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail-w:380px; --cue-h:64px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
#siteWrap{position:fixed;left:0;top:0;bottom:0;right:var(--rail-w);overflow:hidden}
#site{position:absolute;inset:0 0 var(--cue-h) 0;overflow:auto}
body.float #siteWrap{right:0}
body.rail-off #siteWrap{right:0}
body.rail-off #rail,body.rail-off #cue{display:none}
body.rail-off #site{bottom:0}

/* ---------- mock site: chrome ---------- */
.promo{background:var(--bd-night);color:#fff;font-size:13.5px;text-align:center;padding:8px 16px}
.promo button{background:none;border:0;color:#a5b4fc;font-weight:700;text-decoration:underline;margin-left:6px;font-size:13.5px}
.nav{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 32px;height:66px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.02em;background:none;border:0;padding:0;color:var(--ink)}
.brand i{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#6366f1,#3730a3);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:14px}
.nav-links{display:flex;gap:22px;flex:1}
.nav-links button{background:none;border:0;font-size:14.5px;font-weight:600;color:var(--ink);padding:6px 0}
.nav-links button.on{color:var(--bd-blue);box-shadow:inset 0 -2px 0 var(--bd-blue)}
.nav-right{display:flex;gap:10px;align-items:center}
.nav-login{background:none;border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-weight:600;font-size:14px}
.nav-cta{background:var(--bd-blue);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:700;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:6px;padding:12px 22px;font-weight:700;font-size:15px;border:2px solid var(--bd-blue);background:var(--bd-blue);color:#fff}
.btn:hover{background:var(--bd-blue-dk);border-color:var(--bd-blue-dk)}
.btn.ghost{background:transparent;color:var(--bd-blue)}
.btn.ghost:hover{background:var(--bd-blue-soft)}
.btn.light{background:#fff;color:var(--ink);border-color:#fff}
.btn.outline-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.page{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
section.band{padding:72px 0}
section.tint{background:var(--tint)}
section.night{background:var(--bd-night);color:#fff}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--bd-blue)}
h1{font-size:48px;line-height:1.08;letter-spacing:-.03em;margin:12px 0 16px;text-wrap:balance}
h2{font-size:34px;line-height:1.15;letter-spacing:-.025em;margin:8px 0 14px;text-wrap:balance}
h3{font-size:19px;margin:0 0 8px}
.lede{font-size:18px;color:var(--muted);max-width:60ch;margin:0 0 26px}
.center{text-align:center}.center .lede{margin-left:auto;margin-right:auto}
.sechead{margin-bottom:34px}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(900px 500px at 85% 20%,rgba(79,70,229,.45),transparent 60%),radial-gradient(700px 400px at 10% 110%,rgba(0,80,200,.35),transparent 60%),var(--bd-night);color:#fff;padding:76px 0 70px}
.hero.perz{background:radial-gradient(900px 500px at 80% 10%,rgba(129,140,248,.55),transparent 60%),linear-gradient(135deg,#1e1b4b 0%,#4338ca 100%)}
.hero.light{background:radial-gradient(700px 400px at 90% 0%,rgba(79,70,229,.14),transparent 60%),linear-gradient(180deg,#f6f7ff,#eef0ff);color:var(--ink)}
.hero .eyebrow{color:#a5b4fc}
.hero.light .eyebrow{color:var(--bd-blue)}
.hero .lede{color:#c4d3ea}
.hero.light .lede{color:var(--muted)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-points{display:flex;gap:22px;flex-wrap:wrap;margin-top:26px;font-size:13.5px;color:#a9bbd6}
.hero.light .hero-points{color:var(--muted)}
.hero-points span::before{content:"✓";color:var(--safe);font-weight:800;margin-right:6px}
.resume{display:flex;align-items:center;gap:16px;margin-top:26px;max-width:520px;padding:16px 18px;border-radius:12px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;text-align:left;width:100%}
.resume:hover{background:rgba(255,255,255,.17)}
.resume .ri{width:42px;height:42px;border-radius:10px;background:#fff;color:var(--bd-blue);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.resume small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#c7d2fe;font-weight:800}
.resume b{display:block;font-size:17px}
.resume em{font-style:normal;font-size:13px;color:#e0e7ff}
.resume .arw{margin-left:auto;font-size:20px}

/* device art (pure CSS) */
.art{position:relative;height:400px}
.laptop{position:absolute;right:0;top:10px;width:470px;max-width:100%}
.screen{background:#0a1020;border:10px solid #1f2738;border-bottom-width:14px;border-radius:16px 16px 4px 4px;height:290px;padding:16px;display:grid;grid-template-columns:44px 1fr;gap:14px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.app-side{display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:4px}
.app-side i{width:26px;height:26px;border-radius:8px;background:#18233a}
.app-side i.on{background:var(--bd-blue)}
.app-main{display:flex;flex-direction:column;gap:12px;color:#fff;min-width:0}
.app-top{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;border-radius:50%;flex:none;background:conic-gradient(var(--safe) 0 100%);display:flex;align-items:center;justify-content:center}
.ring span{width:78px;height:78px;border-radius:50%;background:#0a1020;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;color:#9fb0cc}
.ring b{font-size:15px;color:#fff}
.app-top h4{margin:0 0 4px;font-size:16px}
.app-top p{margin:0;font-size:12px;color:#8fa1bf}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:#121b2e;border-radius:9px;padding:9px 10px;font-size:10.5px;color:#8fa1bf}
.tile b{display:block;font-size:17px;color:#fff}
.base{height:14px;background:linear-gradient(#d6dce8,#98a2b5);border-radius:0 0 16px 16px;margin:0 -26px}
.phone{position:absolute;left:0;bottom:0;width:178px;height:340px;border-radius:30px;background:#0a1020;border:8px solid #1f2738;padding:26px 12px 12px;box-shadow:0 30px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:9px}
.phone::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:54px;height:6px;border-radius:9px;background:#1f2738}
.notif{background:#fff;border-radius:12px;padding:9px 10px;color:var(--ink);font-size:11px;line-height:1.35;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.notif b{display:flex;gap:6px;align-items:center;font-size:11.5px}
.notif b::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--bd-blue);flex:none}
.notif.bad b{color:var(--danger)}
.notif.bad b::before{background:var(--danger)}
.notif.ok b{color:#0f8a5f}
.notif.ok b::before{background:var(--safe)}
.notif.dim{opacity:.6}
.float-badge{position:absolute;right:20px;bottom:6px;background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:700;box-shadow:0 16px 36px rgba(0,0,0,.35);display:flex;gap:9px;align-items:center}
.float-badge i{width:28px;height:28px;border-radius:50%;background:var(--safe);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal}

/* trust strip */
.trust{background:var(--bd-night-2);color:#a9bbd6;font-size:13.5px}
.trust .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:18px;padding-bottom:18px}
.trust span{display:flex;gap:8px;align-items:center}
.trust svg{color:#a5b4fc;width:18px;height:18px}

/* cards & grids */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.card{border:1px solid var(--line);border-radius:14px;padding:26px;background:#fff;text-align:left}
.card p{color:var(--muted);margin:0 0 14px}
button.card{font-size:inherit;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
button.card:hover{border-color:var(--bd-blue);transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,40,120,.1)}
.icbox{width:46px;height:46px;border-radius:12px;background:var(--bd-blue-soft);color:var(--bd-blue);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.seg-card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.seg-card .art-top{height:150px;position:relative;overflow:hidden}
.seg-card .art-top.c1{background:radial-gradient(260px 160px at 70% 30%,#818cf8,transparent),linear-gradient(135deg,#1e1b4b,#4338ca)}
.seg-card .art-top.c2{background:radial-gradient(260px 160px at 30% 30%,#33c3a0,transparent),linear-gradient(135deg,#0b3b3a,#0f6e63)}
.seg-card .art-top.c3{background:radial-gradient(260px 160px at 60% 70%,#8a6bff,transparent),linear-gradient(135deg,#1b1450,#3a2aa8)}
.seg-card .art-top svg{position:absolute;right:22px;bottom:18px;width:70px;height:70px;color:rgba(255,255,255,.9);stroke-width:1.3}
.seg-card .body{padding:24px}
.link{color:var(--bd-blue);font-weight:700}
.pillar{display:flex;flex-direction:column}
.pillar ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}

/* scamio band */
.scamio-band{display:grid;grid-template-columns:minmax(0,1.1fr) 300px;gap:40px;align-items:center;background:radial-gradient(600px 300px at 90% 10%,rgba(79,70,229,.4),transparent 60%),var(--bd-night);color:#fff;border-radius:20px;padding:44px 48px;overflow:hidden}
.scamio-band p{color:#c3cbe0}
.chatphone{width:270px;min-height:330px;border-radius:30px;background:#0a1020;border:8px solid #1f2738;padding:24px 12px 12px;display:flex;flex-direction:column;gap:8px;margin:0 auto;position:relative}
.chatphone .hd{font-size:11px;color:#8fa1bf;text-align:center;margin-bottom:4px}
.bub{max-width:82%;padding:8px 11px;border-radius:14px;font-size:12px;line-height:1.4}
.bub.me{align-self:flex-end;background:var(--bd-blue);color:#fff;border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:#18233a;color:#e5ecf7;border-bottom-left-radius:4px}
.bub.bot b{color:#ff8a80}

/* stats & chart */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.stat b{display:block;font-size:44px;color:var(--bd-blue);letter-spacing:-.03em;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
.chart{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}
.chart .card h3{font-size:16px}
.bar{display:grid;grid-template-columns:140px minmax(0,1fr) 44px;gap:12px;align-items:center;margin:12px 0;font-size:14px}
.bar .tr{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px;background:#9aa6ba}
.bar.us .tr i{background:var(--bd-blue)}
.bar.us{font-weight:800}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.src{font-size:12px;color:var(--muted)}

/* articles & footer */
.post{padding:0;overflow:hidden}
.post .cover{height:150px}
.post .cover.a{background:linear-gradient(135deg,#ffb36b,#ff5a5f)}
.post .cover.b{background:linear-gradient(135deg,#5fa8ff,#5b2bff)}
.post .cover.c{background:linear-gradient(135deg,#29d3a6,#0a6fd6)}
.post .body{padding:20px 22px}
.post small{color:var(--muted);font-size:12.5px}
.renew{display:flex;align-items:center;gap:30px;justify-content:space-between;flex-wrap:wrap;border-radius:18px;padding:34px 40px;background:linear-gradient(135deg,var(--bd-blue-soft),#f6f7ff);border:1px solid #e0e7ff}
.foot{background:var(--bd-night);color:#97a6bf;padding:56px 0 30px;font-size:13.5px}
.foot-grid{display:grid;grid-template-columns:1.3fr repeat(4,minmax(0,1fr));gap:30px}
.foot h5{color:#fff;font-size:13px;margin:0 0 12px;letter-spacing:.04em}
.foot ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.foot .tagline{color:#fff;font-size:20px;font-weight:800;margin:10px 0}
.foot-bottom{margin-top:40px;padding-top:20px;border-top:1px solid #1d273a;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px}

/* plans */
.perz-band{background:var(--bd-blue);color:#fff;animation:fade .4s ease both}
.perz-band .wrap{display:flex;align-items:center;gap:24px;padding-top:22px;padding-bottom:22px;flex-wrap:wrap}
.perz-band small{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#e0e7ff}
.perz-band h3{font-size:22px;margin:4px 0 2px}
.perz-band p{margin:0;color:#eef2ff;font-size:14.5px}
.perz-band .btn{margin-left:auto}
.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:center;margin:0 0 34px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px;background:#fff}
.seg button{border:0;background:none;border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;padding:28px;background:#fff}
.plan.popular{border-color:#c7d2fe}
.plan.pick{border:2px solid var(--bd-blue);box-shadow:0 16px 40px rgba(79,70,229,.18)}
.plan .tag{position:absolute;top:-12px;left:24px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--ink);color:#fff}
.plan.pick .tag{background:var(--bd-blue)}
.plan h3{font-size:23px;margin:6px 0 2px}
.plan .dev{color:var(--muted);font-size:14px}
.plan .old{font-size:14px;color:var(--muted);text-decoration:line-through;margin-top:14px}
.plan .price{font-size:36px;font-weight:800;letter-spacing:-.02em}
.plan .pnote{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.plan .badge{font-size:12.5px;font-weight:700;color:var(--bd-blue);background:var(--bd-blue-soft);border-radius:8px;padding:7px 10px;margin-bottom:14px}
.plan ul{list-style:none;padding:0;margin:0 0 22px;color:var(--ink);font-size:14px;flex:1}
.plan li{display:flex;gap:8px;margin-bottom:8px}
.plan li::before{content:"✓";color:var(--bd-blue);font-weight:800}
.plan .acts{display:flex;flex-direction:column;gap:8px}
.plan .acts .btn{justify-content:center}
.illus{text-align:center;font-size:12.5px;color:var(--muted);margin-top:18px}
.cmp{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.cmp th,.cmp td{padding:13px 16px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{background:var(--ink);color:#fff;font-size:14px}
.cmp td.y{color:var(--bd-blue);font-weight:800}
.cmp td.n{color:#b7c0cf}
.tablewrap{overflow-x:auto}
details.faq{border-bottom:1px solid var(--line);padding:16px 0}
details.faq summary{font-weight:700;font-size:16.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.faq summary::after{content:"+";color:var(--bd-blue);font-size:20px}
details.faq[open] summary::after{content:"–"}
details.faq p{color:var(--muted);margin:10px 0 0;max-width:75ch}
.fam-card .who{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--bd-blue)}

/* product page */
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.ticks{list-style:none;padding:0;margin:0 0 24px}
.ticks li{padding-left:28px;position:relative;margin-bottom:11px}
.ticks li::before{content:"✓";position:absolute;left:0;top:0;color:var(--safe);font-weight:800}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.scampro{border-radius:20px;padding:44px;background:radial-gradient(600px 300px at 100% 0%,rgba(79,70,229,.18),transparent 60%),var(--bd-blue-soft);border:2px solid #c7d2fe}
.scampro .feat{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--bd-blue);color:#fff;vertical-align:5px;margin-left:8px}
.inbox{background:#fff;border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,40,120,.12);overflow:hidden}
.inbox .row{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.inbox .row:last-child{border:0}
.inbox .av{width:32px;height:32px;border-radius:50%;background:#dfe7f3;flex:none}
.inbox .row div{flex:1;min-width:0}
.inbox .row small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagok,.tagbad{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}
.tagok{background:#dcf7ea;color:#0f8a5f}.tagbad{background:var(--danger-soft);color:var(--danger)}

/* tools */
.checker{display:flex;gap:10px;max-width:640px}
.checker input,.form input{flex:1;font:inherit;padding:14px;border:1px solid #c9d2e0;border-radius:8px;min-width:0}
.verdict{margin-top:20px;max-width:640px;border-radius:12px;padding:18px 20px;background:var(--danger-soft);border:1px solid #f5b5ae;color:var(--ink)}
.verdict b{color:var(--danger)}
.form{max-width:420px;display:flex;flex-direction:column;gap:12px}
.form label{font-size:13px;font-weight:700}
.login-card{background:#fff;border-radius:18px;padding:34px;box-shadow:0 24px 60px rgba(0,40,120,.15);color:var(--ink)}
.summary{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:36px;align-items:start}
.sumbox{border:1px solid var(--line);border-radius:16px;padding:26px;background:#fff;box-shadow:0 16px 40px rgba(0,40,120,.08)}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.sumrow.save{color:#0f8a5f;font-weight:700}
.sumrow.total{border:0;font-size:20px;font-weight:800}
.paybox{border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px;display:flex;flex-direction:column;gap:10px}

/* site overlays */
#toast{position:absolute;left:50%;top:80px;transform:translate(-50%,-12px);opacity:0;transition:.25s;z-index:20;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast div{background:var(--sy-navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 10px 28px rgba(0,0,0,.25);white-space:nowrap}
#toast div::before{content:"✓";color:var(--sy-green-2);margin-right:8px;font-weight:800}
#assistant{position:absolute;right:16px;bottom:calc(var(--cue-h) + 14px);z-index:16;width:340px;background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.28);border:1px solid var(--line);overflow:hidden;animation:fade .35s ease both}
body.rail-off #assistant{bottom:14px}
#assistant .ah{background:var(--bd-blue);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700}
#assistant .ah button{margin-left:auto;background:none;border:0;color:#fff;font-size:18px}
#assistant .ab{padding:16px;display:flex;flex-direction:column;gap:12px;font-size:14.5px}
#assistant .msg{background:var(--tint);border-radius:10px;padding:10px 12px}
#assistant .chips{display:flex;gap:8px;flex-wrap:wrap}
#assistant .chips button{border:1px solid var(--bd-blue);color:var(--bd-blue);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700}
#assistant .chips button:hover{background:var(--bd-blue-soft)}
#asstOpen{position:absolute;right:16px;bottom:calc(var(--cue-h) + 14px);z-index:16;border:0;background:var(--bd-blue);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---------- cue bar (presenter prompts, Syntasa) ---------- */
#cue{position:absolute;left:0;right:0;bottom:0;height:var(--cue-h);background:var(--sy-navy);color:#e8f3ee;border-top:2px solid var(--sy-green);
  display:flex;align-items:center;gap:16px;padding:0 16px;font-size:13.5px;z-index:25}
#cue .act{font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#5fe0a8;display:flex;flex-direction:column;gap:5px;white-space:nowrap}
#cue .dots{display:flex;gap:4px}
#cue .dots i{width:7px;height:7px;border-radius:50%;background:#2a3a48}
#cue .dots i.done{background:var(--sy-green-2)}
#cue .dots i.now{background:#fff}
#cue .txt{flex:1;min-width:0;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#cue .txt b{color:#fff}
#cue .count{font:700 12px var(--mono);color:#5fe0a8;white-space:nowrap}
#cue .ctl{display:flex;gap:6px;align-items:center}
#cue .ctl .jl{font:10.5px var(--mono);color:#8aa0ad;margin:0 2px 0 6px}
#cue .ctl button{background:#172634;color:#e8f3ee;border:1px solid #2a3a48;border-radius:6px;padding:6px 8px;font-size:12px;font-weight:600;white-space:nowrap}
#cue .ctl button:hover{border-color:#5f7b8a}
#cue .ctl button.primary{background:var(--sy-green-2);color:#04140c;border-color:var(--sy-green-2)}
#cue .ctl button.mode{background:#fff;color:var(--sy-navy);border-color:#fff}
body.prompts-off #cue .act,body.prompts-off #cue .txt,body.prompts-off #cue .count{visibility:hidden}
#cue .ctl{margin-left:auto}
#cue .ctl button.guide{background:transparent;border-color:#5fe0a8;color:#5fe0a8}
body.prompts-off #cue .ctl button.guide{border-color:#5f7b8a;color:#8aa0ad}
.cue-pulse{outline:3px solid var(--sy-green-2)!important;outline-offset:3px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{outline-color:rgba(31,184,122,.2)}}
body.prompts-off .cue-pulse{outline:none!important;animation:none}

/* ---------- presenter widgets (Syntasa) ---------- */
#rail{position:fixed;right:0;top:0;bottom:0;width:var(--rail-w);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(170deg,var(--sy-mint) 0%,#f6fbf9 38%,var(--sy-lav) 70%,var(--sy-aqua) 100%);border-left:1px solid var(--sy-line);color:var(--sy-ink)}
.rail-top{display:flex;justify-content:space-between;align-items:center;font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--sy-muted)}
.sy-word{font:800 17px var(--sans);letter-spacing:.12em;color:var(--sy-green);text-transform:uppercase}
.sy-word small{font:600 10.5px var(--mono);letter-spacing:.06em;color:var(--sy-muted);margin-left:8px}
.pnl{flex:none;background:var(--sy-card);border:1px solid var(--sy-line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(19,137,92,.08);color:var(--sy-ink)}
.pnl-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--sy-line);background:linear-gradient(90deg,rgba(211,243,228,.7),rgba(255,255,255,.6) 55%,rgba(238,232,253,.7))}
.pnl-h b{font-size:15px;color:var(--sy-navy)}
.pnl-h small{display:block;font:11px var(--mono);color:var(--sy-muted)}
.pnl-h .live{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--sy-green-2);animation:blink 1.6s infinite}
.pnl-h .min{background:none;border:0;color:var(--sy-muted);font-size:16px;padding:0 2px}
@keyframes blink{50%{opacity:.3}}
.pnl.min .pnl-b,.pnl.min .pnl-f,.pnl.min .cora-now,.pnl.min .cora-hist{display:none}
.pnl-b{padding:6px 14px 10px}
.prow{display:grid;grid-template-columns:128px minmax(0,1fr);gap:10px;padding:4px 0;border-top:1px dashed var(--sy-line);font-size:12px;line-height:1.4}
.prow:first-child{border-top:0}
.prow .k{color:var(--sy-muted)}
.prow .k i{font:700 8.5px var(--mono);font-style:normal;letter-spacing:.06em;color:var(--sy-violet);background:var(--sy-lav);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
.prow .v{font-weight:600;word-wrap:break-word;color:var(--sy-navy)}
.prow .v.good{color:var(--sy-green)} .prow .v.warn{color:var(--sy-warn)} .prow .v.muted{color:#9aa8b0;font-weight:400}
.prow.flash{animation:flash 3.5s ease-out}
@keyframes flash{0%,55%{background:rgba(31,184,122,.3);box-shadow:inset 3px 0 0 #1fb87a}100%{background:transparent;box-shadow:inset 3px 0 0 transparent}}
.pnl-f{padding:8px 14px;border-top:1px solid var(--sy-line);font:10.5px var(--mono);color:var(--sy-muted)}
.cora .pnl-h{background:linear-gradient(90deg,rgba(238,232,253,.85),rgba(255,255,255,.6) 60%,rgba(205,243,238,.7))}
.cora .pnl-h b span{font:400 12px var(--sans);color:var(--sy-muted);margin-left:6px}
.cora .spark{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--sy-green-2),var(--sy-violet));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.cora .state{margin-left:auto;font:10.5px var(--mono);color:var(--sy-muted)}
.cora .state.on{color:var(--sy-violet)}
.cora-now{padding:14px;font-size:14px;line-height:1.55;min-height:96px;color:var(--sy-navy)}
.cora-now .caret{display:inline-block;width:7px;height:15px;background:var(--sy-violet);vertical-align:-2px;margin-left:2px;animation:blink 1s infinite}
.cora-hist{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.cora-hist div{font-size:12px;color:var(--sy-muted);border-left:2px solid var(--sy-line);padding-left:9px}

/* floating mode: rail becomes a transparent layer, widgets are draggable */
body.float #rail{left:0;width:auto;background:none;border:0;padding:0;pointer-events:none;overflow:visible;z-index:30;bottom:var(--cue-h)}
body.float .rail-top{display:none}
body.float .pnl{position:absolute;width:360px;pointer-events:auto;box-shadow:0 24px 60px rgba(15,26,36,.28);backdrop-filter:blur(10px)}
body.float .pnl-h{cursor:grab}
body.float .pnl-h:active{cursor:grabbing}
body.float #pnl .pnl-b{max-height:calc(100vh - 260px);overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<div id="siteWrap">
  <div id="site"></div>
  <div id="toast"></div>
  <div id="asstMount"></div>
  <div id="cue"></div>
</div>

<aside id="rail">
  <div class="rail-top"><span class="sy-word">Syntasa</span><span>Presenter view</span></div>
  <div class="pnl" id="pnl">
    <div class="pnl-h"><div><b>Customer Intelligence</b><small id="pnlSub">anonymous session</small></div><span class="live"></span><button class="min" data-min="pnl" title="Minimise">–</button></div>
    <div class="pnl-b" id="pnlBody"></div>
    <div class="pnl-f">Rows tagged AI are inferred by the model</div>
  </div>
  <div class="pnl cora" id="coraCard">
    <div class="pnl-h"><span class="spark">✦</span><b>AI-assisted summary</b><span class="state" id="coraState">watching</span><button class="min" data-min="coraCard" title="Minimise">–</button></div>
    <div class="cora-now" id="coraNow"></div>
    <div class="cora-hist" id="coraHist"></div>
  </div>
</aside>

<script>
(function () {
  // ---- tuning ---------------------------------------------------------------
  const CONFIG = {
    // [ms on page, score]. Shorter than Synford so the profile can lock after
    // ~10s of reading plus a scroll, which is what the storyboard calls for.
    DWELL: [[2000, 25], [5000, 50], [8000, 65], [12000, 80], [20000, 90]],
    SCROLL: { half: 0.40, deep: 0.75 },
    PERSONALIZE_AT: 70,
    SWITCH_MARGIN: 10,
    PRICE_TOGGLES: 3,
    STORAGE_KEY: 'bd-ci-profile-v1',
    UI_KEY: 'bd-ci-ui-v1'
  };

  const PRODUCTS = {
    total:    { name: 'Synguard Essential',    need: 'device' },
    premium:  { name: 'Synguard Plus',  need: 'scam' },
    ultimate: { name: 'Synguard Ultimate', need: 'identity' },
    vpn:      { name: 'Synguard VPN',       need: 'privacy' }
  };
  const NEEDS = { scam: 'Scam protection', privacy: 'Privacy & VPN', identity: 'Identity protection', device: 'Device security' };
  // [family, individual]
  const PERSONA = {
    scam: ['Worried Protector', 'Scam-wary Individual'],
    privacy: ['Privacy-First Family', 'Privacy-First'],
    identity: ['Identity Guardian', 'Identity Guardian'],
    device: ['Family Essentials', 'Essential Protector']
  };
  const LABEL = { home: 'Home', consumer: 'Consumer plans', total: 'Synguard Essential', premium: 'Synguard Plus',
    ultimate: 'Synguard Ultimate', vpn: 'Synguard VPN', scamio: 'ScamSense', linkcheck: 'Link Checker', login: 'Log in', checkout: 'Checkout' };
  const TRACKED = ['consumer', 'total', 'premium', 'ultimate', 'vpn', 'scamio', 'linkcheck'];
  // Illustrative first-year prices [individual, family].
  const PRICE = { total: [29.99, 44.99], premium: [39.99, 59.99], ultimate: [49.99, 69.99], vpn: [34.99, 34.99] };
  const BADGE = {
    total: 'Essential protection for every device',
    premium: 'Includes AI-powered Scam Shield AI',
    ultimate: 'Adds dark-web monitoring for your identity'
  };

  // ---- icons (inline SVG, stroke style) ---------------------------------------
  const ICON = {
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    eye: '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/>',
    user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
    phone: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
    mail: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/>',
    chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    wifi: '<path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/>',
    zap: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    alert: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
    key: '<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zM15.5 7.5l3 3L22 7l-3-3"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',
    award: '<circle cx="12" cy="8" r="7"/><path d="M8.21 13.89L7 23l5-3 5 3-1.21-9.12"/>',
    case: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    layers: '<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>',
    radar: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    cpu: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>'
  };
  function ic(n) { return '<svg class="ic" viewBox="0 0 24 24">' + ICON[n] + '</svg>'; }

  // ---- state ----------------------------------------------------------------
  function blank() {
    return {
      anonId: 'a7f3c2', visits: 1, returning: false, known: false,
      items: {},                 // page -> {dwellMs, maxScroll, visits, lastAt}
      visited: {},
      household: null, linkChecked: false, priceToggles: 0,
      leader: null, assistantShown: false, assistantClosed: false, planSaved: false, devices: null,
      purchased: false, sawPerzConsumer: false
    };
  }
  let state = blank();
  let page = 'home', billing = 'yearly';
  let lastPersonalized = false, lastPerzSig = '', lastMilestone = null, toastTimer = null;
  const $ = (s) => document.querySelector(s);
  const site = $('#site');

  function rec(k) {
    if (!state.items[k]) state.items[k] = { dwellMs: 0, maxScroll: 0, visits: 0, lastAt: 0 };
    return state.items[k];
  }
  function dwMs(k) { return state.items[k] ? state.items[k].dwellMs : 0; }
  function save() { try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
  function load() {
    try { const s = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY)); return s && s.items ? s : null; }
    catch (e) { return null; }
  }

  // ---- the model ------------------------------------------------------------
  function score(k) {
    const a = state.items[k];
    if (!a) return 0;
    let s = 0;
    CONFIG.DWELL.forEach(function (d) { if (a.dwellMs >= d[0]) s = d[1]; });
    if (a.maxScroll >= CONFIG.SCROLL.half) s += 10;
    if (a.maxScroll >= CONFIG.SCROLL.deep) s += 5;
    if (a.visits > 1) s += (a.visits - 1) * 5;
    return Math.min(100, s);
  }
  // Needs are built from what the visitor read and did, not from one page.
  function needs() {
    const n = {
      scam: Math.min(100, Math.max(score('scamio'), score('premium')) + (state.linkChecked ? 20 : 0)),
      privacy: Math.max(score('vpn'), Math.round(score('premium') * 0.3)),
      identity: score('ultimate'),
      device: score('total')
    };
    return Object.keys(n).map(function (k) { return { key: k, score: n[k] }; })
      .sort(function (a, b) { return b.score - a.score; });
  }
  function profile() {
    const r = Object.keys(PRODUCTS).map(function (k) {
      return { key: k, score: score(k), seenAt: (state.items[k] || {}).lastAt || 0 };
    }).sort(function (x, y) { return (y.score - x.score) || (y.seenAt - x.seenAt); });
    let top = r[0], second = r[1];
    // Sticky leader: a rival must clear SWITCH_MARGIN to take over.
    if (state.leader && top.key !== state.leader) {
      const cur = r.filter(function (x) { return x.key === state.leader; })[0];
      if (cur && top.score - cur.score < CONFIG.SWITCH_MARGIN) { second = top; top = cur; }
    }
    const sep = top.score - second.score;
    let conf = 'Pending';
    if (top.score >= 80 || (top.score >= 70 && sep >= 15)) conf = 'High';
    else if (top.score >= 50 && sep >= 10) conf = 'Medium';
    else if (top.score >= 35) conf = 'Low';
    const personalized = top.score >= CONFIG.PERSONALIZE_AT && conf === 'High';
    const comparing = !personalized && second.score >= 35 && top.score < CONFIG.PERSONALIZE_AT;
    const nd = needs();
    const need = nd[0].score >= 20 ? nd[0] : null;
    const emerging = nd[1].score >= 20 ? nd[1] : null;
    const fam = state.household === 'Family';
    const persona = need ? PERSONA[need.key][fam ? 0 : 1] : null;
    const planKey = personalized ? top.key : (state.leader || 'premium');
    const plan = PRODUCTS[planKey].name + (fam && planKey !== 'vpn' ? ' Family' : '');
    const engaged = TRACKED.filter(function (k) { return score(k) >= 20; }).length;
    return { r: r, top: top, second: second, sep: sep, conf: conf, personalized: personalized, comparing: comparing,
      need: need, emerging: emerging, fam: fam, persona: persona, planKey: planKey, plan: plan, engaged: engaged,
      priceHigh: state.priceToggles >= CONFIG.PRICE_TOGGLES };
  }

  function sentiment(p) {
    if (state.purchased) return 'Confident · purchased';
    if (page === 'checkout') return 'Confident · ready to buy';
    if (state.planSaved) return 'Reassured · plan saved';
    const worried = p.need && p.need.key === 'scam' && state.linkChecked;
    if (p.priceHigh) return worried ? 'Worried · hesitant on price' : 'Hesitant on price';
    if (state.linkChecked) return 'Worried · checking a threat';
    if (p.comparing) return 'Comparing plans';
    if (score('scamio') >= 25) return 'Concerned';
    if (Object.keys(state.visited).some(function (k) { return k !== 'home'; })) return 'Exploring';
    return 'Unknown';
  }
  function urgency() {
    if (state.linkChecked) return 'High';
    if (score('scamio') >= 25) return 'Medium';
    if (Object.keys(PRODUCTS).some(function (k) { return score(k) >= 25; })) return 'Low';
    return '—';
  }
  function propensity(p) {
    if (state.purchased) return 'Converted';
    if (page === 'checkout') return 'Very high (94%)';
    if (state.planSaved) return 'Very high (91%)';
    if (p.personalized) return 'High (78%)';
    if (p.top.score >= 35 || state.linkChecked) return 'Medium (55%)';
    if (p.engaged) return 'Low (30%)';
    return '—';
  }
  function nextAction(p) {
    if (state.purchased) return 'Onboard · install on ' + (state.devices || 5) + ' devices';
    if (page === 'checkout') return 'Hold discount · complete purchase';
    if (state.known) return 'Send to checkout with plan pre-filled';
    if (state.returning && state.planSaved) return 'Resume saved plan · prompt login';
    if (state.planSaved) return 'Plan saved · remind if they leave';
    if (state.assistantShown) return 'Assistant offering plan sizing';
    if (p.personalized && p.priceHigh) return 'Offer 30-day trial + first-year saving';
    if (p.personalized) return 'Lead with ' + p.plan + (p.need && p.need.key === 'scam' ? ' + scam check' : '');
    if (p.comparing) return 'Show side-by-side comparison';
    if (state.linkChecked) return 'Reassure · surface Scam Protection';
    if (p.engaged) return 'Deepen interest · observe';
    return 'Observe · no signal yet';
  }

  // ---- panel ----------------------------------------------------------------
  const ROWS = [
    ['identity', 'Identity'], ['segment', 'Segment'], ['viewing', 'Currently viewing'],
    ['need', 'Primary need', 1], ['emerging', 'Emerging need', 1], ['sentiment', 'Sentiment', 1],
    ['urgency', 'Urgency', 1], ['household', 'Household'], ['price', 'Price sensitivity', 1],
    ['persona', 'Persona', 1], ['plan', 'Recommended plan', 1], ['confidence', 'Confidence', 1],
    ['propensity', 'Propensity to buy', 1], ['nba', 'Next best action', 1], ['engagement', 'Engagement depth'],
    ['dwell', 'Time on this page']
  ];
  function values(p) {

    const saving = p.priceHigh ? Math.round(y * 0.3 * 100) / 100 : 0;
    if (state.purchased) {
      return '<section class="hero perz"><div class="wrap hero-grid"><div><div class="eyebrow">Order confirmed</div><h1>You\'re protected, Sarah.</h1>' +
        '<p class="lede">' + p.plan + ' is active for ' + devices + ' devices. Install Synguard on each device from Synguard Hub.</p>' +
        '<div class="hero-cta"><button class="btn light">Go to Synguard Hub</button></div></div>' + deviceArt('scam') + '</div></section>' + footer();
    }
    return '<section class="band"><div class="wrap"><div class="eyebrow">Checkout</div><h1>Complete your order</h1>' +
      '<div class="summary"><div><p class="lede">' + (state.known ? 'Signed in as sarah.m@example.com. ' : '') +
        'Your plan is already filled in from what you chose earlier.</p>' +
        '<ul class="ticks"><li>30-day money-back guarantee</li><li>Install on Windows, Mac, Android and iOS</li><li>Cancel auto-renewal any time</li></ul>' +
        '<div class="paybox"><b>Payment details</b><div class="fake">Card number · demo</div><div class="fake">MM / YY · CVC</div></div></div>' +
      '<div class="sumbox"><h3>Order summary</h3>' +
        '<div class="sumrow"><span>Plan</span><b>' + p.plan + '</b></div>' +
        '<div class="sumrow"><span>Coverage</span><span>' + (fam ? '5 accounts · ' : '') + devices + ' devices</span></div>' +
        '<div class="sumrow"><span>Billing</span><span>Yearly</span></div>' +
        '<div class="sumrow"><span>Price</span><span>£' + y.toFixed(2) + '</span></div>' +
        (saving ? '<div class="sumrow save"><span>First-year saving</span><span>−£' + saving.toFixed(2) + '</span></div>' : '') +
        '<div class="sumrow total"><span>Total today</span><span>£' + (y - saving).toFixed(2) + '</span></div>' +
        '<button class="btn" style="width:100%;justify-content:center;margin-top:14px" data-cue="buy" id="buyBtn">Complete purchase</button>' +
        '<p class="demo-note" style="margin-top:10px">Demo only. No payment is taken. Illustrative prices.</p></div></div></div></section>' + footer();
  }

  function renderPage(keepScroll) {
    const p = profile();
    const top = keepScroll ? site.scrollTop : 0;
    let body;
    if (page === 'home') body = pageHome(p);
    else if (page === 'consumer') body = pageConsumer(p);
    else if (PRODUCTS[page]) body = pageProduct(page);
    else if (page === 'scamio') body = pageScamSense();
    else if (page === 'linkcheck') body = pageLinkcheck();
    else if (page === 'login') body = pageLogin();
    else body = pageCheckout(p);
    site.innerHTML = nav() + '<main class="page"' + (keepScroll ? ' style="animation:none"' : '') + '>' + body + '</main>';
    site.scrollTop = top;
    if (page === 'consumer' && p.personalized) state.sawPerzConsumer = true;
    lastPerzSig = perzSig(p);
  }
  // Only the pages that change with the profile re-render, and only when the
  // profile actually changed, so hover and focus are never lost mid-demo.
  function perzSig(p) {
    return [page, p.personalized, p.top.key, state.household, p.priceHigh, state.returning, state.known, state.planSaved, state.purchased].join('|');
  }

  function go(id) {
    page = id;
    if (TRACKED.indexOf(id) >= 0) { const a = rec(id); a.visits += 1; a.lastAt = Date.now(); }
    state.visited[id] = 1;
    renderPage(false);
    sync();
  }

  // ---- assistant (visitor-facing, called in by Cora) --------------------------
  function maybeAssistant(p) {
    if (state.assistantShown || state.planSaved || page !== 'consumer' || !p.personalized || !p.priceHigh) return;
    state.assistantShown = true;
    setTimeout(function () { renderAssistant(1); sync(); }, 900);
  }
  function renderAssistant(stepN) {
    const p = profile();
    const m = $('#asstMount');
    if (stepN === 0) {
      m.innerHTML = (state.assistantShown && !state.planSaved && page === 'consumer')
        ? '<button id="asstOpen" data-cue="assistant">Synguard Assistant</button>' : '';
      return;
    }
    const scam = p.need && p.need.key === 'scam';
    let body;
    if (stepN === 1) {
      body = '<div class="msg">' + (scam
        ? 'Want me to check that message with ScamSense, then size a plan for your ' + (p.fam ? 'family\'s ' : '') + 'devices?'
        : 'Want help sizing the right plan for your devices?') + '</div>' +
        '<div class="msg">How many devices do you want to protect?</div>' +
        '<div class="chips">' + (p.fam ? [5, 10, 25] : [3, 5]).map(function (n) {
          return '<button data-dev="' + n + '">' + n + ' devices</button>';
        }).join('') + '</div>';
    } else {
      body = '<div class="msg"><b>' + p.plan + '</b> covers up to ' + (p.fam ? '25 devices and 5 accounts' : '5 devices') +
        (p.planKey === 'premium' ? ', with AI-powered Scam Shield AI' : '') + '. It comes with a 30-day money-back guarantee.</div>' +
        '<div class="chips"><button data-save="1">Save my plan</button><button data-asst-close="1">Not now</button></div>';
    }
    m.innerHTML = '<div id="assistant" data-cue="assistant"><div class="ah">Synguard Assistant<button data-asst-close="1" aria-label="Close">×</button></div>' +
      '<div class="ab">' + body + '</div></div>';
  }

  // ---- sync: one place that reads the model and updates everything -----------
  function sync() {
    const p = profile();
    if (p.personalized && state.leader && p.top.key !== state.leader) {
      const prev = state.leader; state.leader = p.top.key;
      toast('Interest shifted: ' + PRODUCTS[p.top.key].name + ' overtakes ' + PRODUCTS[prev].name);
    } else if (p.personalized && !lastPersonalized) {
      state.leader = p.top.key;
      toast('Profile locked: ' + p.persona + ' · confidence High');
    }
    lastPersonalized = p.personalized;
    updatePanel(p);
    cora(p);
    maybeAssistant(p);
    if (['home', 'consumer', 'checkout'].indexOf(page) >= 0 && perzSig(p) !== lastPerzSig) renderPage(true);
    updateCue(profile());
    save();
  }

  // ---- presenter actions ------------------------------------------------------
  function reset() {
    try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) {}
    state = blank(); billing = 'yearly';
    lastPersonalized = false; lastMilestone = null;
    $('#coraHist').innerHTML = ''; $('#coraNow').dataset.text = '';
    $('#asstMount').innerHTML = '';
    buildPanel();
    go('home');
  }
  function simulateReturn() {
    state.returning = true; state.visits = 2;
    $('#asstMount').innerHTML = '';
    go('home');
    setTimeout(function () { toast('Profile recovered · last seen 2 days ago'); }, 500);
  }
  function seed(act) {
    reset();
    const t = Date.now();
    if (act >= 1) {
      state.visited.consumer = 1; state.visited.scamio = 1; state.visited.linkcheck = 1;
      state.household = 'Family';
      state.items.consumer = { dwellMs: 4000, maxScroll: 0.5, visits: 1, lastAt: t - 60000 };
      state.items.scamio = { dwellMs: 9000, maxScroll: 0.6, visits: 1, lastAt: t - 40000 };
      state.items.linkcheck = { dwellMs: 3000, maxScroll: 0.2, visits: 1, lastAt: t - 20000 };
      state.linkChecked = true;
    }
    if (act >= 2) {
      state.visited.premium = 1;
      state.items.premium = { dwellMs: 11000, maxScroll: 0.8, visits: 1, lastAt: t - 10000 };
      state.leader = 'premium'; state.sawPerzConsumer = true;
    }
    if (act >= 3) {
      state.priceToggles = CONFIG.PRICE_TOGGLES; state.assistantShown = true; state.planSaved = true; state.devices = 25;
    }
    lastPersonalized = profile().personalized;
    go(act >= 1 ? 'consumer' : 'home');
    toast('Jumped to act ' + (act + 1) + ' · ' + ACTS[act]);
  }

  // ---- widget layout: docked rail or floating, draggable cards ------------------
  let ui = { mode: 'docked', pos: {}, guide: true };
  try { ui = Object.assign(ui, JSON.parse(localStorage.getItem(CONFIG.UI_KEY)) || {}); } catch (e) {}
  function saveUi() { try { localStorage.setItem(CONFIG.UI_KEY, JSON.stringify(ui)); } catch (e) {} }
  function defaultPos(id) {
    const W = window.innerWidth, H = window.innerHeight;
    const h = document.getElementById(id).offsetHeight || 260;
    return id === 'pnl' ? { left: W - 360 - 20, top: 84 } : { left: 20, top: Math.max(84, H - 64 - 16 - h) };
  }
  function clampPos(el, pos) {
    const W = window.innerWidth, H = window.innerHeight;
    return { left: Math.max(6, Math.min(pos.left, W - el.offsetWidth - 6)), top: Math.max(6, Math.min(pos.top, H - 64 - 46)) };
  }
  function applyMode() {
    const float = ui.mode === 'floating';
    document.body.classList.toggle('float', float);
    ['pnl', 'coraCard'].forEach(function (id) {
      const el = document.getElementById(id);
      if (float) {
        const pos = clampPos(el, ui.pos[id] || defaultPos(id));
        el.style.left = pos.left + 'px'; el.style.top = pos.top + 'px';
      } else { el.style.left = ''; el.style.top = ''; }
    });
    $('#btnMode').textContent = float ? 'Dock widgets' : 'Float widgets';
  }
  function applyGuide() {
    document.body.classList.toggle('prompts-off', !ui.guide);
    $('#btnGuide').textContent = ui.guide ? 'Guide: On' : 'Guide: Off';
  }
  function toggleGuide() { ui.guide = !ui.guide; saveUi(); applyGuide(); updateCue(profile()); }
  function toggleMode() { ui.mode = ui.mode === 'floating' ? 'docked' : 'floating'; saveUi(); applyMode(); }
  document.addEventListener('mousedown', function (e) {
    if (!document.body.classList.contains('float')) return;
    const head = e.target.closest('.pnl-h');
    if (!head || e.target.closest('button')) return;
    const card = head.parentElement;
    e.preventDefault();
    const r = card.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top;
    const move = function (ev) {
      const pos = clampPos(card, { left: ev.clientX - ox, top: ev.clientY - oy });
      card.style.left = pos.left + 'px'; card.style.top = pos.top + 'px';
    };
    const up = function () {
      document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
      ui.pos[card.id] = { left: parseFloat(card.style.left), top: parseFloat(card.style.top) }; saveUi();
    };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });
  window.addEventListener('resize', function () { if (ui.mode === 'floating') applyMode(); });

  // ---- wiring -------------------------------------------------------------------
  document.addEventListener('click', function (e) {
    const t = e.target;
    const g = t.closest('[data-go]');
    if (g) { e.preventDefault(); go(g.dataset.go); return; }
    const buy = t.closest('[data-buy]');
    if (buy) { e.preventDefault(); if (!state.leader) state.leader = buy.dataset.buy; go('checkout'); return; }
    const tab = t.closest('[data-tab]');
    if (tab) { state.household = tab.dataset.tab; renderPage(true); sync(); return; }
    const bill = t.closest('[data-bill]');
    if (bill) {
      if (bill.dataset.bill !== billing) {
        billing = bill.dataset.bill; state.priceToggles += 1;
        if (state.priceToggles === CONFIG.PRICE_TOGGLES) toast('Price hesitation detected');
        renderPage(true); sync();
      }
      return;
    }
    if (t.closest('#lcBtn')) {
      if (!state.linkChecked) { state.linkChecked = true; toast('Threat check detected · urgency High'); }
      $('#lcOut').innerHTML = verdict(); sync(); return;
    }
    if (t.closest('#buyBtn')) { state.purchased = true; toast('Purchase complete · profile is now a customer record'); renderPage(false); sync(); return; }
    const dev = t.closest('[data-dev]');
    if (dev) { state.devices = +dev.dataset.dev; renderAssistant(2); return; }
    if (t.closest('[data-save]')) {
      state.planSaved = true; $('#asstMount').innerHTML = '';
      toast('Plan saved: ' + profile().plan + ' · ' + state.devices + ' devices'); sync(); return;
    }
    if (t.closest('[data-asst-close]')) { state.assistantClosed = true; renderAssistant(0); sync(); return; }
    if (t.closest('#asstOpen')) { renderAssistant(state.devices ? 2 : 1); sync(); return; }
    if (t.closest('[data-mock]')) { toast(t.closest('[data-mock]').dataset.mock); return; }
    const j = t.closest('[data-jump]');
    if (j) { seed(+j.dataset.jump); return; }
    if (t.closest('#btnReturn')) { simulateReturn(); return; }
    if (t.closest('#btnReset')) { reset(); return; }
    if (t.closest('#btnMode')) { toggleMode(); return; }
    if (t.closest('#btnGuide')) { toggleGuide(); return; }
    const mn = t.closest('[data-min]');
    if (mn) { const m = document.getElementById(mn.dataset.min).classList.toggle('min'); mn.textContent = m ? '+' : '–'; }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'loginForm') return;
    e.preventDefault();
    state.known = true;
    toast('Identity resolved · anonymous profile merged into User ID');
    go('checkout');
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input,textarea')) return;
    if (e.key === 'p' || e.key === 'P') toggleGuide();
    if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('rail-off');
    if (e.key === 'f' || e.key === 'F') toggleMode();
  });
  site.addEventListener('scroll', function () {
    if (TRACKED.indexOf(page) < 0) return;
    const max = site.scrollHeight - site.clientHeight;
    const d = max > 0 ? Math.min(1, site.scrollTop / max) : 0;
    const a = rec(page);
    if (d > a.maxScroll + 0.02) { a.maxScroll = d; sync(); }
  }, { passive: true });

  // Reading time only counts while the tab is visible.
  setInterval(function () {
    if (document.hidden) return;
    if (TRACKED.indexOf(page) >= 0) { const a = rec(page); a.dwellMs += 1000; a.lastAt = Date.now(); }
    sync();
  }, 1000);

  // ---- boot -----------------------------------------------------------------
  buildPanel(); buildCue(); applyMode(); applyGuide();
  const prior = load();
  if (prior) {
    state = Object.assign(blank(), prior);
    lastPersonalized = profile().personalized;
    setTimeout(function () { toast('Profile restored from this browser'); }, 600);
  }
  renderPage(false);
  sync();
})();
</script>
</body>
</html>
